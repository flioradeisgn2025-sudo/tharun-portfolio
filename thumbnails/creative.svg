<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#140a12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="55%" r="45%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- Scattered design cards -->
  <rect x="120" y="80" width="160" height="120" rx="10" fill="#161618" stroke="#ec4899" stroke-width="1" opacity="0.5" transform="rotate(-8,200,140)"/>
  <rect x="135" y="95" width="130" height="70" rx="5" fill="#1e1e21"/>
  <rect x="135" y="175" width="60" height="6" rx="2" fill="#ec4899" opacity="0.5"/>
  <rect x="280" y="60" width="160" height="120" rx="10" fill="#161618" stroke="#ffd93d" stroke-width="1" opacity="0.4" transform="rotate(5,360,120)"/>
  <rect x="295" y="75" width="130" height="70" rx="5" fill="#1e1e21"/>
  <rect x="295" y="155" width="70" height="6" rx="2" fill="#ffd93d" opacity="0.5"/>
  <rect x="440" y="90" width="160" height="120" rx="10" fill="#161618" stroke="#2a2a2e" stroke-width="1" transform="rotate(-3,520,150)"/>
  <rect x="455" y="105" width="130" height="70" rx="5" fill="#1e1e21"/>
  <rect x="455" y="185" width="80" height="6" rx="2" fill="#ec4899" opacity="0.4"/>
  <rect x="580" y="70" width="120" height="100" rx="10" fill="#161618" stroke="#2a2a2e" stroke-width="1" transform="rotate(6,640,120)"/>
  <rect x="592" y="82" width="96" height="55" rx="5" fill="#1e1e21"/>
  <!-- Palette circles -->
  <circle cx="200" cy="280" r="20" fill="#ec4899" opacity="0.3"/>
  <circle cx="260" cy="290" r="16" fill="#ffd93d" opacity="0.3"/>
  <circle cx="310" cy="275" r="18" fill="#a855f7" opacity="0.3"/>
  <circle cx="365" cy="285" r="14" fill="#38bdf8" opacity="0.3"/>
  <!-- Title -->
  <text x="400" y="360" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#f0efe9">Creative</text>
  <text x="400" y="385" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ec4899" font-weight="600" letter-spacing="3">DESIGN PORTFOLIO</text>
  <!-- Tags -->
  <rect x="220" y="405" width="80" height="22" rx="11" fill="#ec4899" opacity="0.12" stroke="#ec4899" stroke-width="0.5"/>
  <text x="260" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ec4899">AI Art</text>
  <rect x="315" y="405" width="80" height="22" rx="11" fill="#ffd93d" opacity="0.12" stroke="#ffd93d" stroke-width="0.5"/>
  <text x="355" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#ffd93d">Branding</text>
  <rect x="410" y="405" width="80" height="22" rx="11" fill="#a855f7" opacity="0.12" stroke="#a855f7" stroke-width="0.5"/>
  <text x="450" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#a855f7">Social Ads</text>
</svg>
