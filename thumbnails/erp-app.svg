<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090a0d"/>
      <stop offset="100%" style="stop-color:#0a0e14"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#20c3f5;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <!-- Dashboard cards -->
  <rect x="120" y="80" width="170" height="100" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1"/>
  <text x="205" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#20c3f5">48</text>
  <text x="205" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a8e" letter-spacing="1">STUDENTS</text>
  <rect x="310" y="80" width="170" height="100" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1"/>
  <text x="395" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#0acd95">12</text>
  <text x="395" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a8e" letter-spacing="1">CLASSES</text>
  <rect x="500" y="80" width="170" height="100" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1"/>
  <text x="585" y="120" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#a855f7">96%</text>
  <text x="585" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#8a8a8e" letter-spacing="1">ATTENDANCE</text>
  <!-- Table mockup -->
  <rect x="120" y="210" width="550" height="30" rx="6" fill="#1e1e21" stroke="#2a2a2e" stroke-width="1"/>
  <rect x="120" y="248" width="550" height="30" rx="0" fill="#141416" stroke="#2a2a2e" stroke-width="0.5"/>
  <rect x="120" y="285" width="550" height="30" rx="0" fill="#161618" stroke="#2a2a2e" stroke-width="0.5"/>
  <rect x="120" y="322" width="550" height="30" rx="0" fill="#141416" stroke="#2a2a2e" stroke-width="0.5"/>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#20c3f5" opacity="0.5">ERP System</text>
</svg>
