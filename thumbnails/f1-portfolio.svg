<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0b"/>
      <stop offset="100%" style="stop-color:#1a0a0a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#ef4444;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#ef4444;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <!-- Racing stripes -->
  <rect x="0" y="160" width="800" height="3" fill="url(#stripe)" opacity="0.4"/>
  <rect x="0" y="290" width="800" height="3" fill="url(#stripe)" opacity="0.3"/>
  <!-- F1 text -->
  <text x="400" y="180" text-anchor="middle" font-family="sans-serif" font-size="80" font-weight="900" fill="#ef4444" opacity="0.12">F1</text>
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#f0efe9" letter-spacing="4">PORTFOLIO</text>
  <rect x="300" y="260" width="200" height="8" rx="2" fill="#8a8a8e" opacity="0.35"/>
  <rect x="280" y="290" width="100" height="32" rx="16" fill="#ef4444"/>
  <text x="330" y="311" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#fff">Explore</text>
  <rect x="400" y="290" width="120" height="32" rx="16" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <!-- Speed lines -->
  <line x1="50" y1="350" x2="250" y2="350" stroke="#ef4444" stroke-width="2" opacity="0.2"/>
  <line x1="100" y1="365" x2="350" y2="365" stroke="#ef4444" stroke-width="1.5" opacity="0.15"/>
  <line x1="550" y1="100" x2="750" y2="100" stroke="#ef4444" stroke-width="2" opacity="0.2"/>
  <line x1="500" y1="85" x2="700" y2="85" stroke="#ef4444" stroke-width="1.5" opacity="0.15"/>
</svg>
