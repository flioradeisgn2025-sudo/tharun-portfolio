<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#140a12"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- Design elements -->
  <rect x="150" y="100" width="180" height="180" rx="12" fill="#161618" stroke="#ec4899" stroke-width="1" opacity="0.5" transform="rotate(-5,240,190)"/>
  <rect x="170" y="115" width="140" height="90" rx="6" fill="#1e1e21"/>
  <rect x="170" y="215" width="80" height="8" rx="2" fill="#ec4899" opacity="0.5"/>
  <rect x="170" y="230" width="120" height="6" rx="2" fill="#8a8a8e" opacity="0.3"/>
  <rect x="350" y="80" width="180" height="180" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1" transform="rotate(3,440,170)"/>
  <rect x="370" y="95" width="140" height="90" rx="6" fill="#1e1e21"/>
  <rect x="370" y="195" width="90" height="8" rx="2" fill="#d946ef" opacity="0.5"/>
  <rect x="370" y="210" width="110" height="6" rx="2" fill="#8a8a8e" opacity="0.3"/>
  <rect x="540" y="120" width="140" height="140" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1" transform="rotate(-2,610,190)"/>
  <rect x="555" y="135" width="110" height="70" rx="6" fill="#1e1e21"/>
  <rect x="555" y="215" width="70" height="8" rx="2" fill="#ec4899" opacity="0.4"/>
