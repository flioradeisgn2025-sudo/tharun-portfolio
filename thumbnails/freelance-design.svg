  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#f0efe9">Freelance Design</text>
  <text x="400" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#ec4899" font-weight="600" letter-spacing="3">5+ CLIENTS</text>
