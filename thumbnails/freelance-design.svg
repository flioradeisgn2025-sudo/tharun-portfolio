  <rect x="230" y="390" width="90" height="24" rx="12" fill="#ec4899" opacity="0.12" stroke="#ec4899" stroke-width="0.5"/>
  <text x="275" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#ec4899">Photoshop</text>
  <rect x="335" y="390" width="90" height="24" rx="12" fill="#d946ef" opacity="0.12" stroke="#d946ef" stroke-width="0.5"/>
  <text x="380" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#d946ef">Figma</text>
  <rect x="440" y="390" width="100" height="24" rx="12" fill="#ec4899" opacity="0.12" stroke="#ec4899" stroke-width="0.5"/>
