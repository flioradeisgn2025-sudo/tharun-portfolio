<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#120a16"/>
    </linearGradient>
    <radialGradient id="glow1" cx="40%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="65%" r="45%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- Neural network nodes -->
  <circle cx="300" cy="150" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <circle cx="400" cy="100" r="14" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
  <circle cx="500" cy="150" r="18" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <circle cx="350" cy="250" r="22" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.35"/>
  <circle cx="450" cy="250" r="22" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.35"/>
  <circle cx="400" cy="350" r="20" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.3"/>
  <!-- Connection lines -->
  <line x1="300" y1="168" x2="350" y2="228" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <line x1="400" y1="114" x2="350" y2="228" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <line x1="400" y1="114" x2="450" y2="228" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <line x1="500" y1="168" x2="450" y2="228" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <line x1="350" y1="272" x2="400" y2="330" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
  <line x1="450" y1="272" x2="400" y2="330" stroke="#6366f1" stroke-width="1" opacity="0.2"/>
  <!-- Center content -->
  <text x="400" y="215" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="900" fill="#f0efe9" letter-spacing="3">AGENTRIX</text>
  <text x="400" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a855f7" font-weight="600" letter-spacing="4">AI SAAS PLATFORM</text>
  <!-- Tech tags -->
  <rect x="200" y="390" width="80" height="24" rx="12" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5"/>
  <text x="240" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a855f7">LangGraph</text>
  <rect x="295" y="390" width="70" height="24" rx="12" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="0.5"/>
  <text x="330" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6366f1">CrewAI</text>
  <rect x="380" y="390" width="70" height="24" rx="12" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="0.5"/>
  <text x="415" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#a855f7">FastAPI</text>
  <rect x="465" y="390" width="60" height="24" rx="12" fill="#6366f1" opacity="0.15" stroke="#6366f1" stroke-width="0.5"/>
  <text x="495" y="406" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#6366f1">RAG</text>
</svg>
