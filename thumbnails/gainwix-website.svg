<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111113"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#0acd95;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#6940f2;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- Browser mockup -->
  <rect x="100" y="60" width="600" height="340" rx="12" fill="#161618" stroke="#2a2a2e" stroke-width="1.5"/>
  <rect x="100" y="60" width="600" height="32" rx="12" fill="#1e1e21"/>
  <rect x="100" y="80" width="600" height="12" fill="#1e1e21"/>
  <circle cx="120" cy="76" r="5" fill="#ff5f57"/>
  <circle cx="136" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="152" cy="76" r="5" fill="#28c840"/>
  <rect x="250" y="70" width="300" height="14" rx="7" fill="#111113"/>
  <!-- Content mockup -->
  <rect x="140" y="115" width="180" height="12" rx="3" fill="#0acd95" opacity="0.8"/>
  <rect x="140" y="140" width="280" height="18" rx="3" fill="#f0efe9" opacity="0.9"/>
  <rect x="140" y="170" width="520" height="8" rx="2" fill="#8a8a8e" opacity="0.4"/>
  <rect x="140" y="185" width="460" height="8" rx="2" fill="#8a8a8e" opacity="0.3"/>
  <rect x="140" y="200" width="380" height="8" rx="2" fill="#8a8a8e" opacity="0.25"/>
  <!-- CTA button -->
  <rect x="140" y="225" width="130" height="36" rx="18" fill="#0acd95"/>
  <text x="205" y="248" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#0a0a0a">Get Started</text>
  <!-- Cards mockup -->
  <rect x="140" y="285" width="160" height="90" rx="8" fill="#1e1e21" stroke="#2a2a2e" stroke-width="1"/>
  <rect x="320" y="285" width="160" height="90" rx="8" fill="#1e1e21" stroke="#2a2a2e" stroke-width="1"/>
  <rect x="500" y="285" width="160" height="90" rx="8" fill="#1e1e21" stroke="#2a2a2e" stroke-width="1"/>
  <!-- Logo text -->
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0acd95" opacity="0.6">gainwix.ai</text>
</svg>
