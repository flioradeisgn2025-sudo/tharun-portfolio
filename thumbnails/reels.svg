<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#140a0e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f43f5e"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <!-- Phone frames for reels -->
  <rect x="180" y="50" width="120" height="210" rx="14" fill="#1a1a1d" stroke="#2a2a2e" stroke-width="1.5" transform="rotate(-6,240,155)"/>
  <rect x="188" y="62" width="104" height="186" rx="10" fill="#111113"/>
  <rect x="195" y="70" width="90" height="120" rx="4" fill="#1e1e21"/>
  <text x="240" y="140" text-anchor="middle" font-size="22" opacity="0.35">&#9654;</text>
  <rect x="330" y="35" width="140" height="245" rx="16" fill="#1a1a1d" stroke="url(#igGrad)" stroke-width="2"/>
  <rect x="340" y="50" width="120" height="215" rx="12" fill="#111113"/>
  <rect x="348" y="58" width="104" height="145" rx="4" fill="#1e1e21"/>
  <text x="400" y="140" text-anchor="middle" font-size="28" opacity="0.4">&#9654;</text>
  <!-- Reel icon badge -->
  <rect x="360" y="215" width="80" height="22" rx="11" fill="url(#igGrad)" opacity="0.3"/>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff">REEL</text>
  <rect x="500" y="55" width="120" height="210" rx="14" fill="#1a1a1d" stroke="#2a2a2e" stroke-width="1.5" transform="rotate(5,560,160)"/>
  <rect x="508" y="67" width="104" height="186" rx="10" fill="#111113"/>
  <rect x="515" y="75" width="90" height="120" rx="4" fill="#1e1e21"/>
  <text x="560" y="145" text-anchor="middle" font-size="22" opacity="0.35">&#9654;</text>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#f0efe9">Reels</text>
  <text x="400" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#f43f5e" font-weight="600" letter-spacing="3">SOCIAL MEDIA</text>
  <!-- Stats -->
  <text x="300" y="405" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#f43f5e" opacity="0.7">8+</text>
  <text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a8e">Reels</text>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#ec4899" opacity="0.7">4K</text>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a8e">Quality</text>
  <text x="500" y="405" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#a855f7" opacity="0.7">&#10024;</text>
  <text x="500" y="420" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a8e">Motion FX</text>
</svg>
