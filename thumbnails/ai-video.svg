<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#12081a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="45%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="60%" cy="60%" r="45%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:transparent;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#glow1)"/>
  <rect width="800" height="450" fill="url(#glow2)"/>
  <!-- Video player frame -->
  <rect x="160" y="70" width="480" height="270" rx="12" fill="#161618" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
  <!-- Play button -->
  <circle cx="400" cy="205" r="40" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.5"/>
  <polygon points="388,185 388,225 420,205" fill="#a855f7" opacity="0.7"/>
  <!-- Timeline bar -->
  <rect x="180" y="310" width="440" height="4" rx="2" fill="#2a2a2e"/>
  <rect x="180" y="310" width="180" height="4" rx="2" fill="#a855f7" opacity="0.7"/>
  <circle cx="360" cy="312" r="6" fill="#a855f7"/>
  <!-- AI sparkles -->
  <text x="200" y="120" font-size="16" opacity="0.3">&#10024;</text>
  <text x="580" y="140" font-size="20" opacity="0.25">&#10024;</text>
  <text x="250" y="280" font-size="14" opacity="0.2">&#10024;</text>
  <text x="540" y="260" font-size="18" opacity="0.25">&#10024;</text>
  <!-- Title -->
  <text x="400" y="380" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" fill="#f0efe9">AI Video</text>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a855f7" font-weight="600" letter-spacing="3">MOTION GRAPHICS</text>
</svg>
